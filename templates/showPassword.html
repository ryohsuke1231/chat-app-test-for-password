<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>友達追加用パスワード</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Ubuntu", sans-serif;
        background: #f0f2f5;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }

      .box {
        background: white;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        width: 320px;
        text-align: center;
      }

      .box h1 {
        margin-bottom: 16px;
        font-size: 22px;
      }

      .box p {
        font-size: 15px;
        margin: 8px 0;
        color: #333;
      }

      .password-box {
        font-family: "Source Code Pro", "Consolas", monospace;
        font-size: 18px;
        font-weight: bold;
        background: #f9f9f9;
        border: 1px solid #ccc;
        padding: 10px;
        border-radius: 8px;
        margin: 16px 0;
        word-break: break-all;
        letter-spacing: 1px; /* 少し広げると見やすい */
}


      .box button {
        width: 100%;
        padding: 12px;
        margin-top: 16px;
        background-color: #4caf50;
        border: none;
        color: white;
        font-size: 16px;
        border-radius: 8px;
        cursor: pointer;
        transition: background-color 0.3s ease;
      }

      .box button:hover {
        background-color: #45a049;
      }

      .rotate {
        animation: rotate 0.8s linear infinite;
        color: #4caf50;
        margin-bottom: 20px;
      }

      @keyframes rotate {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="box">
      <i class="fa-solid fa-user-plus rotate" style="font-size: 80px"></i>
      <h1>友達追加用パスワード</h1>
      <p>友達追加用パスワードが生成されました。</p>
      <p>大切に保管してください。</p>
      <div class="password-box">{{ new_password }}</div>
      <button onclick="copyString('{{ new_password }}')" id="copy-button">
        コピー
      </button>
      <button onclick="check()">閉じる</button>
    </div>
    <script>
      function check() {
        window.location.href = "{{ url_for('login') }}";
      }
      function copyString(text) {
        const temp = document.createElement("textarea");
        temp.value = text;
        document.body.appendChild(temp);
        temp.select();
        document.execCommand("copy");
        document.body.removeChild(temp);
        document.getElementById("copy-button").innerText = "コピーしました";
        setTimeout(() => {
          document.getElementById("copy-button").innerText = "コピー";
        }, 2000);
      }
    </script>
  </body>
</html>
